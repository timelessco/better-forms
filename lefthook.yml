pre-commit:
  parallel: true
  jobs:
    - name: fmt
      run: bun x oxfmt {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - name: lint
      run: bun x oxlint --type-aware --fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    - name: knip
      run: bun x knip --strict --use-tsconfig-files
      glob:
        - "**/*.ts"
        - "**/*.tsx"

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun x tsc --noEmit
    - name: test
      run: bun run test
