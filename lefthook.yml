pre-commit:
  parallel: true
  jobs:
    - name: fmt
      run: pnpm exec oxfmt {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - name: lint
      run: pnpm exec oxlint --type-aware --fix {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    - name: knip
      run: pnpm exec knip --strict --use-tsconfig-files
      glob:
        - "**/*.ts"
        - "**/*.tsx"

